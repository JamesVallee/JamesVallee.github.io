<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | James Vallée</title>
  <meta name="description" content="{{ page.subtitle | default: 'Mechanical Engineering Portfolio — James Vallée' }}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Project / experience detail stylesheet (opt-in via front matter) -->
  {% if page.load_project_css %}
    <link rel="stylesheet" href="{{ '/assets/css/project.css' | relative_url }}">
  {% endif %}

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/JVfavicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/JVfavicon.png">
</head>

<body data-theme="{{ page.page_theme | default: page.nav | default: 'home' }}">

  <!-- ═══════════════════════ HEADER / NAV ═══════════════════════ -->
  <header id="site-header">
    <div class="header-content">

      <!-- Logo with accent-tinted backdrop -->
      <a href="{{ '/' | relative_url }}" class="logo" aria-label="James Vallée Home">
        <span class="logo-bg"></span>
        <img src="/assets/images/JV_logo-removebg.png" alt="JV">
      </a>

      <!-- Desktop nav -->
      <nav id="main-nav" aria-label="Main navigation">
        <a href="{{ '/'            | relative_url }}" class="{% if page.nav == 'home'       %}active{% endif %}">Home</a>
        <a href="{{ '/experience/' | relative_url }}" class="{% if page.nav == 'experience' %}active{% endif %}">Experience</a>
        <a href="{{ '/fsae/'       | relative_url }}" class="{% if page.nav == 'fsae'       %}active{% endif %}">FSAE&nbsp;Projects</a>
        <a href="{{ '/personal/'   | relative_url }}" class="{% if page.nav == 'personal'   %}active{% endif %}">Personal&nbsp;Projects</a>
        <a href="{{ '/about/'      | relative_url }}" class="{% if page.nav == 'about'      %}active{% endif %}">About</a>
      </nav>

      <!-- Burger button (mobile only) -->
      <button class="burger" id="burger-btn" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
      </button>

    </div>
  </header>

  <!-- ═══════════════════════ BANNER / HERO ═══════════════════════ -->
  {% if page.banner_image %}
  <section class="banner" role="banner" aria-label="{{ page.title }}">
    <div class="banner__bg" style="background-image: url('{{ page.banner_image | relative_url }}');"></div>
    <div class="banner__scrim"></div>
    <div class="banner__grain" aria-hidden="true"></div>
    <div class="banner-content">
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}
        <p>{{ page.subtitle }}</p>
      {% endif %}
    </div>
  </section>
  {% endif %}

  <!-- ═══════════════════════ MAIN CONTENT ═══════════════════════ -->
  <main class="{% if page.banner_image %}has-banner{% endif %}">
    {{ content }}
  </main>

  <!-- ═══════════════════════ FOOTER ═══════════════════════ -->
  <footer>
    <div class="page-content">
      &copy; {{ "now" | date: "%Y" }} James Vallée
    </div>
  </footer>

  <!-- ═══════════════════════ SCRIPTS ═══════════════════════ -->
  <script>
  // ── 1. Nav: go solid/frosted on scroll ──────────────────────────
  (function () {
    var header = document.getElementById('site-header');
    if (!header) return;

    function updateHeader() {
      if (header.classList.contains('menu-open')) {
        header.classList.remove('scrolled');
        return;
      }
      header.classList.toggle('scrolled', window.scrollY > 40);
    }

    window.addEventListener('scroll', updateHeader, { passive: true });
    window.addEventListener('resize', updateHeader);
    updateHeader();
  })();

  // ── 2. Burger / mobile nav toggle ───────────────────────────────
  (function () {
    var btn = document.getElementById('burger-btn');
    var nav = document.getElementById('main-nav');
    var header = document.getElementById('site-header');
    if (!btn || !nav) return;

    function setMenuState(open) {
      nav.classList.toggle('nav--open', open);
      btn.classList.toggle('burger--open', open);
      btn.setAttribute('aria-expanded', open);
      if (header) {
        header.classList.toggle('menu-open', open);
        if (open) {
          header.classList.remove('scrolled');
        } else {
          header.classList.toggle('scrolled', window.scrollY > 40);
        }
      }
    }

    btn.addEventListener('click', function () {
      var open = !nav.classList.contains('nav--open');
      if (header) {
        header.classList.remove('scrolled');
        header.classList.toggle('menu-open', open);
      }
      setMenuState(open);
    });

    // Close on link click (single-page feel)
    nav.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () {
        setMenuState(false);
      });
    });
  })();

  // ── 3. Scroll-reveal ─────────────────────────────────────────────
  (function () {
    var targets = document.querySelectorAll(
      '.experience-highlight, .experience-card, .section-text, .section-image, .section-image-brp, .overview-block, .tools-skills-highlight, .about-hero, .about-body, .about-bio, .about-skills'
    );

    targets.forEach(function (el) {
      el.classList.add('reveal');
    });

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.02, rootMargin: '0px 0px -8% 0px' });

      targets.forEach(function (el) {
        if (el.getBoundingClientRect().top < window.innerHeight + 120) {
          el.classList.add('visible');
        } else {
          io.observe(el);
        }
      });
    } else {
      targets.forEach(function (el) { el.classList.add('visible'); });
    }
  })();

  // ── 4. Carousel (NRC page) ───────────────────────────────────────
  (function () {
    var track = document.querySelector('.carousel-track');
    if (!track) return;
    var slides = Array.from(track.children);
    var nextBtn = document.querySelector('.carousel-btn.next');
    var prevBtn = document.querySelector('.carousel-btn.prev');
    var index = 0;
    function go() { track.style.transform = 'translateX(-' + (index * 100) + '%)'; }
    if (nextBtn) nextBtn.addEventListener('click', function () { index = (index + 1) % slides.length; go(); });
    if (prevBtn) prevBtn.addEventListener('click', function () { index = (index - 1 + slides.length) % slides.length; go(); });
    var sx = 0;
    track.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
    track.addEventListener('touchend', function (e) {
      var dx = sx - e.changedTouches[0].clientX;
      if (dx > 50 && nextBtn) nextBtn.click();
      if (dx < -50 && prevBtn) prevBtn.click();
    });
  })();

  // ── 5. Custom cursor (fine-pointer / hover-capable devices only) ──
  (function () {
    if (!window.matchMedia || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

    var dot = document.createElement('div');
    dot.className = 'cursor-dot';
    var ring = document.createElement('div');
    ring.className = 'cursor-ring';
    document.body.appendChild(dot);
    document.body.appendChild(ring);
    document.body.classList.add('has-custom-cursor');

    var mouseX = -100, mouseY = -100, ringX = -100, ringY = -100, primed = false;

    window.addEventListener('mousemove', function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      dot.style.transform = 'translate(' + mouseX + 'px,' + mouseY + 'px) translate(-50%,-50%)';
      if (!primed) { ringX = mouseX; ringY = mouseY; primed = true; }
    });

    function tick() {
      ringX += (mouseX - ringX) * 0.18;
      ringY += (mouseY - ringY) * 0.18;
      ring.style.transform = 'translate(' + ringX + 'px,' + ringY + 'px) translate(-50%,-50%)';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    var hoverSelector = 'a, button, .learn-more-btn, input, textarea, select, [role="button"]';
    document.addEventListener('mouseover', function (e) {
      if (e.target.closest && e.target.closest(hoverSelector)) {
        document.body.classList.add('cursor-hover');
      }
    });
    document.addEventListener('mouseout', function (e) {
      if (e.target.closest && e.target.closest(hoverSelector)) {
        document.body.classList.remove('cursor-hover');
      }
    });

    document.addEventListener('mouseleave', function () { dot.style.opacity = '0'; ring.style.opacity = '0'; });
    document.addEventListener('mouseenter', function () { dot.style.opacity = '1'; ring.style.opacity = ''; });
  })();

  // ── 6. Hero title — split into letters for staggered fade+rise ────
  (function () {
    var h1 = document.querySelector('.banner-content h1');
    if (!h1) return;
    var text = h1.textContent;
    h1.setAttribute('aria-label', text);
    h1.innerHTML = '';
    var i = 0;
    text.split('').forEach(function (ch) {
      var span = document.createElement('span');
      span.className = 'letter';
      span.setAttribute('aria-hidden', 'true');
      span.textContent = (ch === ' ') ? '\u00A0' : ch;
      span.style.animationDelay = (i * 0.035) + 's';
      h1.appendChild(span);
      i++;
    });
  })();

  // ── 7. Nav — sliding pill follows hovered link, rests on active ───
  (function () {
    var nav = document.getElementById('main-nav');
    if (!nav) return;

    var pill = document.createElement('span');
    pill.className = 'nav-pill';
    pill.setAttribute('aria-hidden', 'true');
    nav.insertBefore(pill, nav.firstChild);

    var links = Array.prototype.slice.call(nav.querySelectorAll('a'));

    function moveTo(el) {
      var navRect = nav.getBoundingClientRect();
      var r = el.getBoundingClientRect();
      nav.style.setProperty('--pill-x', (r.left - navRect.left) + 'px');
      nav.style.setProperty('--pill-y', (r.top - navRect.top) + 'px');
      nav.style.setProperty('--pill-w', r.width + 'px');
      nav.style.setProperty('--pill-h', r.height + 'px');
    }

    function restToActive() {
      var active = nav.querySelector('a.active');
      if (active) {
        moveTo(active);
        nav.classList.add('nav-pill-active');
      } else {
        nav.classList.remove('nav-pill-active');
      }
    }

    links.forEach(function (a) {
      a.addEventListener('mouseenter', function () {
        moveTo(a);
        nav.classList.add('nav-pill-active');
      });
    });

    nav.addEventListener('mouseleave', restToActive);
    window.addEventListener('resize', restToActive);

    // Reposition after the mobile menu opens/closes (layout changes from display:none)
    var burgerBtn = document.getElementById('burger-btn');
    if (burgerBtn) burgerBtn.addEventListener('click', function () { setTimeout(restToActive, 50); });

    restToActive();
  })();

  // ── 8. Project detail pages — image zoom lightbox ───────────────
  (function () {
    var galleryImages = document.querySelectorAll('.image-gallery .gallery-grid img');
    if (!galleryImages.length) return;

    var modal = document.createElement('div');
    modal.className = 'image-zoom-modal';
    modal.setAttribute('aria-hidden', 'true');
    modal.innerHTML = '<div class="image-zoom-backdrop"></div><div class="image-zoom-panel"><button class="image-zoom-close" type="button" aria-label="Close image">×</button><img alt="Expanded project image"></div>';
    document.body.appendChild(modal);

    var panel = modal.querySelector('.image-zoom-panel');
    var image = modal.querySelector('.image-zoom-panel img');
    var closeBtn = modal.querySelector('.image-zoom-close');

    function open(img) {
      image.src = img.currentSrc || img.src;
      image.alt = img.alt || '';
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function close() {
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }

    galleryImages.forEach(function (img) {
      img.classList.add('zoomable-image');
      img.setAttribute('role', 'button');
      img.setAttribute('tabindex', '0');
      img.addEventListener('click', function () { open(img); });
      img.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          open(img);
        }
      });
    });

    modal.addEventListener('click', function (e) {
      if (e.target === modal || e.target.classList.contains('image-zoom-backdrop')) {
        close();
      }
    });
    closeBtn.addEventListener('click', close);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('is-open')) close();
    });
  })();

  // ── 9. Specs grid — count up numeric values on scroll-enter ───────
  (function () {
    var spans = document.querySelectorAll('.spec-item span');
    if (!spans.length || !('IntersectionObserver' in window)) return;

    var numRe = /^(-?\d+(?:\.\d+)?)/;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        io.unobserve(entry.target);

        var el = entry.target;
        var text = el.textContent.trim();
        var match = text.match(numRe);
        if (!match) return; // non-numeric spec (e.g. "SolidWorks") — leave untouched

        var target = parseFloat(match[1]);
        var suffix = text.slice(match[1].length);
        var decimals = (match[1].split('.')[1] || '').length;
        var duration = 900;
        var start = null;

        function step(ts) {
          if (!start) start = ts;
          var p = Math.min((ts - start) / duration, 1);
          var eased = 1 - Math.pow(1 - p, 3);
          el.textContent = (target * eased).toFixed(decimals) + suffix;
          if (p < 1) requestAnimationFrame(step);
          else el.textContent = target.toFixed(decimals) + suffix;
        }
        requestAnimationFrame(step);
      });
    }, { threshold: 0.4 });

    spans.forEach(function (el) { io.observe(el); });
  })();

  // ── 10. Mobile image lazy-loading fallback ──────────────────────
  (function () {
    if (!('IntersectionObserver' in window)) return;

    var images = document.querySelectorAll('img[data-src]');
    if (!images.length) return;

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var img = entry.target;
        img.src = img.getAttribute('data-src');
        img.removeAttribute('data-src');
        io.unobserve(img);
      });
    }, { rootMargin: '200px 0px' });

    images.forEach(function (img) { io.observe(img); });
  })();

  // ── 11. Smooth page transitions on internal link clicks ───────────
  (function () {
    var main = document.querySelector('main');
    if (!main) return;

    // Fade the new page in on load
    main.classList.add('main-fade');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { main.classList.remove('main-fade'); });
    });

    document.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var link = e.target.closest && e.target.closest('a[href]');
      if (!link) return;
      if (link.target && link.target !== '_self') return;
      if (link.hasAttribute('download')) return;

      var href = link.getAttribute('href');
      if (!href || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;

      var url;
      try { url = new URL(link.href, window.location.href); } catch (err) { return; }
      if (url.origin !== window.location.origin) return;
      // Let same-page anchor links (e.g. "#section") scroll normally
      if (url.pathname === window.location.pathname && url.hash) return;

      e.preventDefault();
      main.classList.add('main-fade');
      setTimeout(function () { window.location.href = link.href; }, 200);
    });
  })();
  </script>

</body>
</html>
