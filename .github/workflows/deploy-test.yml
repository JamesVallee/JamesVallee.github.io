name: Deploy Jekyll site to public test branch

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'    
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build

      - name: Add CNAME
        run: echo "jamesvallee.ca" > _site/CNAME

      - name: Deploy to public test-build branch
        run: |
          cd _site
          git init
          git branch -M test-build
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy built site (test)"
          git push --force https://${{ secrets.DEPLOY_TOKEN }}@github.com/JamesVallee/JamesVallee.github.io.git test-build
